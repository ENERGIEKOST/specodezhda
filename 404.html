<!DOCTYPE html>
<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 — Страница не найдена | Профессионалы Спецодежда</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f172a">

    <!-- Пути абсолютные от корня: 404 может отдаваться по ЛЮБОМУ несуществующему URL (/foo/bar и т.п.).
         Для локального просмотра (file://) в начале <body> есть скрипт-фикс путей. -->
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/font-awesome-4.7.0/css/font-awesome.min.css">
    
    <style>
        /* ===== ШРИФТЫ (локальный Open Sans, абсолютные пути от корня) ===== */
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-ExtraBold.woff2') format('woff2');font-weight:800 900;font-style:normal;font-display:swap}
        :root {
            --primary: #ea580c; 
            --primary-hover: #c2410c; 
            --secondary: #0f172a; 
            --white: #ffffff; 
            --muted: #94a3b8;
            --font: 'Open Sans', 'Segoe UI', Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font);
            background: var(--secondary);
            color: var(--white);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden; /* контент не обрезается на низких экранах */
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; transition: 0.3s ease; }

        /* ================= ШАПКА ================= */
        .header {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(15, 23, 42, 0.8);
            flex-shrink: 0;
            z-index: 10;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0px 20px;
        }
        .header-inner {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-img { height: 32px; width: auto; }
        .logo-text { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
        .logo-name { font-size: 14px; font-weight: 800; letter-spacing: 1px; }
        .logo-sub { font-size: 9px; font-weight: 700; color: var(--primary); letter-spacing: 2px; }

        /* ================= ОСНОВНОЙ БЛОК ================= */
        .error-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px 20px;
        }

        .error-main::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60vw;
            height: 60vw;
            max-width: 500px;
            max-height: 500px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(234, 88, 12, 0.1) 0%, rgba(234, 88, 12, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .error-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ================= ГЕРОЙ И ОБЛАКО ================= */
        .scene-wrap {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 55vh; /* Уменьшили героя, чтобы всё влезло */
            max-height: 340px;
            margin-bottom: 10px;
            margin-top: 50px; /* Отступ от шапки */
            width: 100%;
        }

        /* Рабочий */
        .character-img {
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
            position: relative;
            z-index: 2; /* Поверх облака */
        }

        /* Облако */
        .cloud-wrapper {
            position: absolute;
            top: -50px;       /* Опустили вниз, чтобы не лезло в шапку */
            left: 55%;       /* Сдвинули вправо */
            z-index: 1;      /* Позади рабочего */
            animation: floatCloud 4s ease-in-out infinite;
        }

        .cloud-bubble {
            position: relative;
            background: var(--white);
            color: var(--primary);
            padding: 8px 16px; /* Сделали поменьше */
            border-radius: 30px;
            font-size: 14px;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }

        /* Пухлость облака */
        .cloud-bubble::before {
            content: '';
            position: absolute;
            background: var(--white);
            width: 25px; height: 25px;
            border-radius: 50%;
            top: -10px; left: 15px;
            z-index: -1;
        }
        .cloud-bubble::after {
            content: '';
            position: absolute;
            background: var(--white);
            width: 35px; height: 35px;
            border-radius: 50%;
            top: -15px; right: 15px;
            z-index: -1;
        }

        /* Хвостик (смотрит вниз-влево на каску) */
        .dot {
            position: absolute;
            background: var(--white);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .dot-1 {
            width: 10px; height: 10px;
            bottom: -12px; left: 5px;
        }
        .dot-2 {
            width: 7px; height: 7px;
            bottom: -20px; left: -8px;
        }
        .dot-3 {
            width: 4px; height: 4px;
            bottom: -27px; left: -15px;
        }

        /* ================= ТЕКСТ (УМЕНЬШЕН) ================= */
        .error-title {
            font-size: clamp(20px, 2.5vw, 26px); /* Стало меньше */
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        .error-title span {
            color: var(--primary);
        }
        .error-text {
            font-size: clamp(12px, 1.2vw, 14px); /* Стало меньше */
            color: var(--muted);
            margin-bottom: 16px;
            font-weight: 500;
            line-height: 1.5;
            max-width: 95%;
        }

        /* ================= КНОПКА (УМЕНЬШЕНА) ================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px; /* Компактнее */
            font-size: 14px;
            font-weight: 800;
            border-radius: 8px;
            transition: 0.3s ease;
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 6px 15px rgba(234, 88, 12, 0.3);
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(234, 88, 12, 0.4);
        }

        /* Плавное парение */
        @keyframes floatCloud {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-5px); }
        }

        /* ================= АДАПТИВ ================= */
        @media (max-width: 768px) {
            .scene-wrap {height: 48vh;margin-top: 10px;}
            .cloud-wrapper {left: 60%;top: -45px;}
            .btn { width: 100%; padding: 12px 20px; }
            .cloud-bubble { font-size: 13px; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <!-- Фикс для локального просмотра (file://): абсолютные пути -> относительные -->
    <script>
    if (location.protocol === 'file:') {
        var fixLocalPaths = function () {
            document.querySelectorAll('img[src^="/"]').forEach(function (el) {
                el.src = el.getAttribute('src').slice(1);
            });
            var css = document.querySelector('link[href^="/font-awesome"]');
            if (css) {
                var n = document.createElement('link');
                n.rel = 'stylesheet';
                n.href = css.getAttribute('href').slice(1);
                css.replaceWith(n);
            }
            /* Шрифты объявлены с абсолютными путями (/fonts/...) —
               для file:// добавляем override-стили с относительными путями */
            var s = document.createElement('style');
            s.textContent = [
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}",
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}",
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}",
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}",
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}",
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-ExtraBold.woff2') format('woff2');font-weight:800 900;font-style:normal;font-display:swap}"
            ].join('');
            document.head.appendChild(s);
        };
        document.addEventListener('DOMContentLoaded', fixLocalPaths);
    }
    </script>

    <header class="header">
        <div class="container header-inner">
            <a href="https://spetsodezhdabt.ru/" class="logo" aria-label="Профессионалы — на главную">
                <img src="/img/logo.webp" alt="Логотип Профессионалы" class="logo-img" width="32" height="32" decoding="async">
                <div class="logo-text">
                    <span class="logo-name">ПРОФЕССИОНАЛЫ</span>
                    <span class="logo-sub">СПЕЦОДЕЖДА</span>
                </div>
            </a>
        </div>
    </header>

    <main class="error-main">
        <div class="container error-container">
            
            <div class="scene-wrap">
                <!-- Облако -->
                <div class="cloud-wrapper">
                    <div class="cloud-bubble">Ой! 404</div>
                    <div class="dot dot-1"></div>
                    <div class="dot dot-2"></div>
                    <div class="dot dot-3"></div>
                </div>
                
                <!-- Герой -->
                <img src="/img/worker.webp" alt="Грустный строитель" class="character-img" width="400" height="400" decoding="async" fetchpriority="high">
            </div>

            <!-- Текст и кнопка уменьшены -->
            <h1 class="error-title">Страница <span>не найдена</span></h1>
            <p class="error-text">
                Похоже, этот раздел переехал или был удален. <br>
                Но спецодежда, обувь и СИЗ на месте — ждем вас на главной!
            </p>

            <a href="https://spetsodezhdabt.ru/" class="btn">
                <i class="fa fa-home"></i> Перейти на главную
            </a>

        </div>
    </main>
</body>
</html>
